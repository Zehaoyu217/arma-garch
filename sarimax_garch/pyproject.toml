[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sarimax-garch"
version = "0.2.0"
description = "statsmodels-SARIMAX-style regression with ARIMA errors, with opt-in GARCH(1,1) and Student-t errors estimated jointly"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "pandas>=1.3", "statsmodels>=0.13"]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning", "ignore::UserWarning", "ignore::FutureWarning"]
